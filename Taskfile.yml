version: '3'

# Include from the project's root Taskfile.yml:
#   includes:
#     pr: ./vendor/davereid/skills/Taskfile.yml

tasks:
  default:
    desc: Fix failing bot PRs and your own failing PRs with Claude Code (all of them, or PR=<number>)
    cmds:
      - task: fix

  fix:
    desc: Fix failing bot PRs and your own failing PRs with Claude Code (all of them, or PR=<number>)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - claude "/pr-fix {{.PR | default "all"}}"

  install-skill:
    desc: Symlink the skills into .claude/skills
    dir: '{{.ROOT_DIR}}'
    cmds:
      - mkdir -p .claude/skills
      # shortcut: assumes Composer's default vendor/ folder; adjust the links if vendor-dir is customized.
      - ln -sfn ../../vendor/davereid/skills/skills/pr-fix .claude/skills/pr-fix
      - ln -sfn ../../vendor/davereid/skills/skills/project-triage .claude/skills/project-triage

  install-workflow:
    desc: Copy the CI workflow template into .github/workflows (shows a diff if it already exists)
    dir: '{{.ROOT_DIR}}'
    vars:
      SRC: '{{.TASKFILE_DIR}}/workflow/pr-fix.yml'
      DEST: .github/workflows/pr-fix.yml
    cmds:
      - mkdir -p .github/workflows
      - |
        if [ -f "{{.DEST}}" ]; then
          diff -u "{{.DEST}}" "{{.SRC}}" || echo "Review the diff above and update {{.DEST}} by hand."
        else
          cp "{{.SRC}}" "{{.DEST}}"
          echo "Created {{.DEST}}. Edit the workflows list under workflow_run, then commit it."
        fi
