name: Fix PR

# Runs on a failing Dependabot PR, on a manual run for any same-repository PR,
# or when the `fix-my-pr` label is added to one. To run again, remove the label and add it again.
on:
  workflow_run:
    # Edit: the workflows whose failures should be diagnosed.
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  pull-requests: write

concurrency:
  group: pr-fix-${{ github.event.workflow_run.head_branch || inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
      || (github.event_name == 'pull_request' && github.event.label.name == 'fix-my-pr')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set (Actions and Dependabot secrets); skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the PR and check that it is eligible
        id: pr
        if: steps.key.outputs.ok == 'true'
        env:
          INPUT_PR: ${{ inputs.pr }}
          LABEL_PR: ${{ github.event.pull_request.number }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          pr="${INPUT_PR:-${LABEL_PR:-$RUN_PR}}"
          if [ -z "$pr" ]; then echo "::notice::No PR for this run."; echo "match=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          read -r branch author cross < <(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefName,author,isCrossRepository -q '"\(.headRefName) \(.author.login) \(.isCrossRepository)"')
          # gh may report bots as "app/dependabot" or "dependabot[bot]"; normalize to the bare name.
          author="${author#app/}"; author="${author%\[bot\]}"
          match=false
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            # Automatic runs: Dependabot PRs only.
            [[ "$branch" == dependabot/* ]] && [ "$author" = dependabot ] && [ "$cross" = false ] && match=true
          else
            # A person asked for it (manual run or label): any PR whose branch is in this repository.
            [ "$cross" = false ] && match=true
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "match=$match" >> "$GITHUB_OUTPUT"
          [ "$match" = true ] || echo "::notice::PR #$pr ($branch by $author) is not eligible for this trigger; skipping."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.match == 'true'
        with:
          ref: ${{ steps.pr.outputs.branch }}

      # Replace with the project's own DDEV setup action if it has one.
      - uses: ddev/github-action-setup-ddev@fdf2f5c97943bae638f31df6df86f1defa6210c0 # v1.12.1
        if: steps.pr.outputs.match == 'true'
        with:
          autostart: false

      # DDEV doesn't pass the runner's CI=true into its containers, so code run
      # with ddev exec can't tell it's in CI. See ddev/github-action-setup-ddev#61.
      - run: ddev dotenv set .ddev/.env.web --ci=true
        if: steps.pr.outputs.match == 'true'

      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        if: steps.pr.outputs.match == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            /pr-fix ${{ steps.pr.outputs.number }}
            You are running in CI (comment-only mode): never commit, push or comment. Write the report to pr-fix-comment.md.
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(ddev:*)"

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.pr.outputs.match == 'true' && hashFiles('pr-fix-comment.md') != ''
        with:
          header: pr-fix
          number: ${{ steps.pr.outputs.number }}
          path: pr-fix-comment.md
